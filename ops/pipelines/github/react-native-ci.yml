# React Native CI/CD Pipeline
# Triggers on changes to React Native-related files
# Includes: lint, test, security scan, build (Android + iOS), and deploy via EAS

name: react-native-ci

on:
    push:
        branches: ["main", "develop"]
        paths:
            - "src/**"
            - "android/**"
            - "ios/**"
            - "package.json"
            - "package-lock.json"
            - "yarn.lock"
            - "app.json"
            - "eas.json"
    pull_request:
        branches: ["main", "develop"]
        paths:
            - "src/**"
            - "android/**"
            - "ios/**"
            - "package.json"
            - "package-lock.json"
            - "yarn.lock"

env:
    NODE_VERSION: "20"
    JAVA_VERSION: "17"

jobs:
    validate:
        name: Lint & Type Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Run TypeScript Check
              run: npx tsc --noEmit

            - name: Check Prettier Formatting
              run: npx prettier --check "src/**/*.{ts,tsx,js,jsx}"

    test:
        name: Unit Tests
        runs-on: ubuntu-latest
        needs: validate
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Run Jest Tests
              run: npm test -- --coverage --watchAll=false

            - name: Upload Coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  files: coverage/lcov.info
                  fail_ci_if_error: false

            - name: Upload Coverage Report
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/

    detox-tests:
        name: E2E Tests (Detox)
        runs-on: macos-14
        needs: test
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Install Detox CLI
              run: npm install -g detox-cli

            - name: Install CocoaPods
              run: cd ios && pod install

            - name: Build Detox
              run: detox build --configuration ios.sim.release
              continue-on-error: true

            - name: Run Detox Tests
              run: detox test --configuration ios.sim.release --cleanup
              continue-on-error: true

    security:
        name: Security Scan
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

            - name: Run NPM Audit
              run: npm audit --production --audit-level=high

            - name: Run Trivy Filesystem Scan
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "table"
                  exit-code: "1"
                  ignore-unfixed: true
                  vuln-type: "os,library"
                  severity: "CRITICAL,HIGH"

    build-android:
        name: Build Android
        runs-on: ubuntu-latest
        needs: security
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: ${{ env.JAVA_VERSION }}

            - name: Install Dependencies
              run: npm ci

            - name: Build Android Release
              working-directory: android
              run: ./gradlew assembleRelease

            - name: Sign APK
              uses: r0adkll/sign-android-release@v1
              id: sign_apk
              with:
                  releaseDirectory: android/app/build/outputs/apk/release
                  signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  alias: ${{ secrets.ANDROID_KEY_ALIAS }}
                  keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
              env:
                  BUILD_TOOLS_VERSION: "34.0.0"

            - name: Upload APK
              uses: actions/upload-artifact@v4
              with:
                  name: rn-apk
                  path: ${{ steps.sign_apk.outputs.signedReleaseFile }}

    build-ios:
        name: Build iOS
        runs-on: macos-14
        needs: security
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Install CocoaPods
              run: cd ios && pod install

            - name: Import Code Signing Certificate
              uses: apple-actions/import-codesign-certs@v2
              with:
                  p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
                  p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

            - name: Download Provisioning Profile
              uses: apple-actions/download-provisioning-profiles@v2
              with:
                  bundle-id: ${{ vars.IOS_BUNDLE_ID }}
                  profile-type: "IOS_APP_STORE"
                  issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
                  api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
                  api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

            - name: Build iOS Archive
              working-directory: ios
              run: |
                  xcodebuild archive \
                      -workspace *.xcworkspace \
                      -scheme App \
                      -archivePath ../build/App.xcarchive \
                      -destination "generic/platform=iOS" \
                      -allowProvisioningUpdates

            - name: Export IPA
              run: |
                  cat > ExportOptions.plist << EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key>
                      <string>app-store</string>
                      <key>teamID</key>
                      <string>${{ secrets.APPLE_TEAM_ID }}</string>
                  </dict>
                  </plist>
                  EOF

                  xcodebuild -exportArchive \
                      -archivePath build/App.xcarchive \
                      -exportPath build/ipa \
                      -exportOptionsPlist ExportOptions.plist

            - name: Upload IPA
              uses: actions/upload-artifact@v4
              with:
                  name: rn-ipa
                  path: build/ipa/*.ipa

    eas-build:
        name: EAS Build (Alternative)
        runs-on: ubuntu-latest
        needs: security
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Setup Expo
              uses: expo/expo-github-action@v8
              with:
                  eas-version: latest
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: Install Dependencies
              run: npm ci

            - name: Build with EAS
              run: |
                  if [ "${{ github.ref }}" == "refs/heads/main" ]; then
                      eas build --platform all --profile production --non-interactive
                  else
                      eas build --platform all --profile preview --non-interactive
                  fi

    deploy-firebase:
        name: Deploy to Firebase App Distribution
        runs-on: ubuntu-latest
        needs: [build-android, build-ios]
        if: github.ref == 'refs/heads/develop'
        steps:
            - name: Download APK
              uses: actions/download-artifact@v4
              with:
                  name: rn-apk
                  path: ./release/android

            - name: Deploy Android to Firebase
              uses: wzieba/Firebase-Distribution-Github-Action@v1
              with:
                  appId: ${{ secrets.FIREBASE_APP_ID }}
                  serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                  groups: testers
                  file: ./release/android/*.apk

    deploy-stores:
        name: Deploy to App Stores
        runs-on: macos-14
        needs: [build-android, build-ios]
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Download APK
              uses: actions/download-artifact@v4
              with:
                  name: rn-apk
                  path: ./release/android

            - name: Download IPA
              uses: actions/download-artifact@v4
              with:
                  name: rn-ipa
                  path: ./release/ios

            - name: Deploy to Play Store
              uses: r0adkll/upload-google-play@v1
              with:
                  serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
                  packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
                  releaseFiles: ./release/android/*.apk
                  track: internal
                  status: completed

            - name: Deploy to TestFlight
              uses: apple-actions/upload-testflight-build@v1
              with:
                  app-path: ./release/ios/*.ipa
                  issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
                  api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
                  api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

    eas-submit:
        name: EAS Submit (Alternative)
        runs-on: ubuntu-latest
        needs: eas-build
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Setup Expo
              uses: expo/expo-github-action@v8
              with:
                  eas-version: latest
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: Submit to App Stores
              run: |
                  eas submit --platform android --profile production --non-interactive
                  eas submit --platform ios --profile production --non-interactive
