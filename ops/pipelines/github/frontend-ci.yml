# Enhanced Frontend CI/CD Pipeline
# Triggers on changes to frontend-related files
# Includes: lint, test, security, build, Lighthouse, bundle analysis, visual regression, browser compatibility

name: frontend-ci

on:
    push:
        branches: ["main", "develop"]
        paths:
            - "src/**"
            - "pages/**"
            - "app/**"
            - "components/**"
            - "public/**"
            - "package.json"
            - "package-lock.json"
            - "yarn.lock"
            - "pnpm-lock.yaml"
            - "*.config.*"
    pull_request:
        branches: ["main", "develop"]
        paths:
            - "src/**"
            - "pages/**"
            - "app/**"
            - "components/**"
            - "public/**"
            - "package.json"

env:
    NODE_VERSION: "20"
    LIGHTHOUSE_THRESHOLD: 80

jobs:
    validate:
        name: Lint & Type Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint || npx eslint . --ext .ts,.tsx,.js,.jsx

            - name: Run TypeScript Check
              run: npm run type-check || npx tsc --noEmit

            - name: Check Formatting
              run: npm run format:check || npx prettier --check "src/**/*.{ts,tsx,js,jsx,css,scss}"

            - name: Run Stylelint (if configured)
              run: npx stylelint "**/*.{css,scss}" || true
              continue-on-error: true

    test:
        name: Unit & Integration Tests
        runs-on: ubuntu-latest
        needs: validate
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Run Tests with Coverage
              run: npm test -- --coverage --watchAll=false

            - name: Upload Coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  files: coverage/lcov.info
                  fail_ci_if_error: false

            - name: Upload Coverage Report
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/

    security:
        name: Security Scan
        runs-on: ubuntu-latest
        needs: validate
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

            - name: Run NPM Audit
              run: npm audit --production --audit-level=high

            - name: Run Trivy Filesystem Scan
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "table"
                  exit-code: "1"
                  ignore-unfixed: true
                  vuln-type: "os,library"
                  severity: "CRITICAL,HIGH"

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [test, security]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Build
              run: npm run build
              env:
                  NODE_ENV: production

            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: build
                  path: |
                      dist/
                      build/
                      .next/
                      out/
                      .output/

    bundle-analysis:
        name: Bundle Analysis
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Build with Stats
              run: |
                  # Try different analysis methods based on framework
                  if grep -q "next" package.json; then
                      ANALYZE=true npm run build || npm run build
                  elif grep -q "vite" package.json; then
                      npm run build -- --mode production
                      npx vite-bundle-visualizer || true
                  else
                      npm run build -- --stats
                      npx webpack-bundle-analyzer dist/stats.json -m static -r bundle-report.html || true
                  fi
              continue-on-error: true

            - name: Check Bundle Size
              run: |
                  # Calculate total bundle size
                  if [ -d "dist" ]; then
                      BUNDLE_SIZE=$(du -sh dist | cut -f1)
                      echo "Total bundle size: $BUNDLE_SIZE"
                  elif [ -d ".next" ]; then
                      BUNDLE_SIZE=$(du -sh .next | cut -f1)
                      echo "Total bundle size: $BUNDLE_SIZE"
                  fi

            - name: Upload Bundle Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: bundle-report
                  path: |
                      bundle-report.html
                      .next/analyze/
                      stats.json

    lighthouse:
        name: Lighthouse Audit
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Download Build
              uses: actions/download-artifact@v4
              with:
                  name: build
                  path: ./

            - name: Start Preview Server
              run: |
                  # Try different preview methods
                  if grep -q "next" package.json; then
                      npm run start &
                  elif grep -q "serve" package.json; then
                      npm run preview &
                  else
                      npx serve -s dist -l 3000 &
                  fi
                  npx wait-on http://localhost:3000 --timeout 60000

            - name: Run Lighthouse CI
              uses: treosh/lighthouse-ci-action@v11
              with:
                  urls: |
                      http://localhost:3000
                  uploadArtifacts: true
                  temporaryPublicStorage: true
                  configPath: ./lighthouserc.json
              continue-on-error: true

            - name: Run Lighthouse (Fallback)
              if: always()
              run: |
                  npx lighthouse http://localhost:3000 \
                      --output json \
                      --output html \
                      --output-path ./lighthouse-report \
                      --chrome-flags="--headless --no-sandbox" || true

            - name: Check Lighthouse Scores
              run: |
                  if [ -f "lighthouse-report.json" ]; then
                      PERF=$(cat lighthouse-report.json | jq '.categories.performance.score * 100')
                      A11Y=$(cat lighthouse-report.json | jq '.categories.accessibility.score * 100')
                      BP=$(cat lighthouse-report.json | jq '.categories["best-practices"].score * 100')
                      SEO=$(cat lighthouse-report.json | jq '.categories.seo.score * 100')

                      echo "Performance: $PERF"
                      echo "Accessibility: $A11Y"
                      echo "Best Practices: $BP"
                      echo "SEO: $SEO"

                      if (( $(echo "$PERF < ${{ env.LIGHTHOUSE_THRESHOLD }}" | bc -l) )); then
                          echo "Warning: Performance score below threshold"
                      fi
                  fi

            - name: Upload Lighthouse Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: lighthouse-report
                  path: |
                      lighthouse-report.*
                      .lighthouseci/

    visual-regression:
        name: Visual Regression Tests
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps chromium

            - name: Download Build
              uses: actions/download-artifact@v4
              with:
                  name: build
                  path: ./

            - name: Start Preview Server
              run: |
                  if grep -q "next" package.json; then
                      npm run start &
                  else
                      npx serve -s dist -l 3000 &
                  fi
                  npx wait-on http://localhost:3000 --timeout 60000

            - name: Run Visual Tests
              run: npx playwright test --project=visual || npx playwright test
              continue-on-error: true

            - name: Upload Visual Test Results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: visual-test-results
                  path: |
                      test-results/
                      playwright-report/

    browser-compatibility:
        name: Browser Compatibility
        runs-on: ubuntu-latest
        needs: build
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox, webkit]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Install Playwright Browser
              run: npx playwright install --with-deps ${{ matrix.browser }}

            - name: Download Build
              uses: actions/download-artifact@v4
              with:
                  name: build
                  path: ./

            - name: Start Preview Server
              run: |
                  if grep -q "next" package.json; then
                      npm run start &
                  else
                      npx serve -s dist -l 3000 &
                  fi
                  npx wait-on http://localhost:3000 --timeout 60000

            - name: Run E2E Tests
              run: npx playwright test --project=${{ matrix.browser }}
              continue-on-error: true

            - name: Upload Test Results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: e2e-${{ matrix.browser }}
                  path: |
                      test-results/
                      playwright-report/

    pwa-validation:
        name: PWA Validation
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Download Build
              uses: actions/download-artifact@v4
              with:
                  name: build
                  path: ./dist

            - name: Validate PWA Manifest
              run: |
                  # Check for manifest file
                  MANIFEST=$(find dist public -name "manifest*.json" 2>/dev/null | head -1)
                  if [ -n "$MANIFEST" ]; then
                      echo "Found manifest: $MANIFEST"
                      cat "$MANIFEST" | jq .

                      # Validate required fields
                      if ! jq -e '.name' "$MANIFEST" > /dev/null; then
                          echo "Warning: manifest missing 'name'"
                      fi
                      if ! jq -e '.icons' "$MANIFEST" > /dev/null; then
                          echo "Warning: manifest missing 'icons'"
                      fi
                      if ! jq -e '.start_url' "$MANIFEST" > /dev/null; then
                          echo "Warning: manifest missing 'start_url'"
                      fi
                  else
                      echo "No PWA manifest found (optional)"
                  fi
              continue-on-error: true

            - name: Check Service Worker
              run: |
                  SW=$(find dist public -name "sw.js" -o -name "service-worker.js" 2>/dev/null | head -1)
                  if [ -n "$SW" ]; then
                      echo "Found service worker: $SW"
                  else
                      echo "No service worker found (optional for non-PWA)"
                  fi
              continue-on-error: true

    accessibility:
        name: Accessibility Tests
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Download Build
              uses: actions/download-artifact@v4
              with:
                  name: build
                  path: ./

            - name: Start Preview Server
              run: |
                  if grep -q "next" package.json; then
                      npm run start &
                  else
                      npx serve -s dist -l 3000 &
                  fi
                  npx wait-on http://localhost:3000 --timeout 60000

            - name: Run axe Accessibility Tests
              run: |
                  npx @axe-core/cli http://localhost:3000 --exit || true

            - name: Run pa11y
              run: |
                  npx pa11y http://localhost:3000 --reporter cli || true
              continue-on-error: true

    deploy-preview:
        name: Deploy Preview
        runs-on: ubuntu-latest
        needs: [build, lighthouse]
        if: github.event_name == 'pull_request'
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download Build
              uses: actions/download-artifact@v4
              with:
                  name: build
                  path: ./dist

            - name: Deploy to Netlify (Preview)
              uses: nwtgck/actions-netlify@v2
              if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
              with:
                  publish-dir: "./dist"
                  production-deploy: false
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  deploy-message: "Preview Deploy from PR #${{ github.event.pull_request.number }}"
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
              continue-on-error: true

    deploy-production:
        name: Deploy Production
        runs-on: ubuntu-latest
        needs: [build, lighthouse, browser-compatibility]
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download Build
              uses: actions/download-artifact@v4
              with:
                  name: build
                  path: ./dist

            - name: Deploy to Netlify (Production)
              uses: nwtgck/actions-netlify@v2
              if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
              with:
                  publish-dir: "./dist"
                  production-deploy: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  deploy-message: "Production Deploy from ${{ github.sha }}"
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
              continue-on-error: true

            - name: Deploy to Vercel (Alternative)
              uses: amondnet/vercel-action@v25
              if: ${{ secrets.VERCEL_TOKEN != '' }}
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
                  vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
                  vercel-args: "--prod"
              continue-on-error: true
