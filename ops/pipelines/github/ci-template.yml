name: ci

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Lint
              # In a real scenario, read the command from ops/config.yml
              run: echo "Running lint from ops/config.yml..."

    test:
        runs-on: ubuntu-latest
        needs: validate
        steps:
            - uses: actions/checkout@v4
            - name: Test
              run: echo "Running test from ops/config.yml..."

    security:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE}} # Optional

            - name: Run Trivy (Filesystem)
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: 'fs'
                  scan-ref: '.'
                  trivy-config: trivy.yaml
                  format: 'table'
                  exit-code: '1'
                  ignore-unfixed: true
                  vuln-type: 'os,library'
                  severity: 'CRITICAL,HIGH'

    build:
        runs-on: ubuntu-latest
        needs: security
        steps:
            - uses: actions/checkout@v4
            - name: Build
              run: echo "Running build from ops/config.yml..."