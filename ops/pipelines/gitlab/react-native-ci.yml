# React Native CI/CD Pipeline for GitLab
# Includes: lint, test, security scan, build (Android + iOS), and deploy

stages:
    - validate
    - test
    - security
    - build
    - deploy

variables:
    NODE_VERSION: "20"
    JAVA_VERSION: "17"

# Base Node.js job
.node_base:
    image: node:${NODE_VERSION}
    cache:
        key: npm-${CI_COMMIT_REF_SLUG}
        paths:
            - node_modules/
            - .npm/
        policy: pull-push
    before_script:
        - npm ci

# Base Android job
.android_base:
    image: cimg/android:2024.01-node
    cache:
        key: rn-android-${CI_COMMIT_REF_SLUG}
        paths:
            - node_modules/
            - android/.gradle/
        policy: pull-push
    before_script:
        - npm ci

# Base iOS job
.ios_base:
    tags:
        - macos
        - xcode
    cache:
        key: rn-ios-${CI_COMMIT_REF_SLUG}
        paths:
            - node_modules/
            - ios/Pods/
        policy: pull-push
    before_script:
        - npm ci
        - cd ios && pod install && cd ..

# ============================================================================
# VALIDATE STAGE
# ============================================================================
lint:
    stage: validate
    extends: .node_base
    script:
        - npm run lint
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

typescript:
    stage: validate
    extends: .node_base
    script:
        - npx tsc --noEmit
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

prettier:
    stage: validate
    extends: .node_base
    script:
        - npx prettier --check "src/**/*.{ts,tsx,js,jsx}"
    allow_failure: true

# ============================================================================
# TEST STAGE
# ============================================================================
unit_tests:
    stage: test
    extends: .node_base
    script:
        - npm test -- --coverage --watchAll=false
    artifacts:
        when: always
        paths:
            - coverage/
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage/cobertura-coverage.xml
            junit: junit.xml
        expire_in: 1 week
    coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

detox_tests:
    stage: test
    extends: .ios_base
    script:
        - npm install -g detox-cli
        - detox build --configuration ios.sim.release || echo "Detox build failed"
        - detox test --configuration ios.sim.release --cleanup || echo "Detox tests failed"
    rules:
        - if: '$CI_COMMIT_BRANCH == "main"'
          when: manual
    allow_failure: true

# ============================================================================
# SECURITY STAGE
# ============================================================================
gitleaks:
    stage: security
    image:
        name: zricethezav/gitleaks:latest
        entrypoint: [""]
    script:
        - gitleaks detect --source . --verbose --no-git
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

npm_audit:
    stage: security
    extends: .node_base
    script:
        - npm audit --production --audit-level=high
    allow_failure: false

trivy_scan:
    stage: security
    image:
        name: aquasec/trivy:latest
        entrypoint: [""]
    script:
        - trivy fs . --exit-code 1 --severity HIGH,CRITICAL --no-progress
    allow_failure: false

# ============================================================================
# BUILD STAGE
# ============================================================================
build_android_debug:
    stage: build
    extends: .android_base
    script:
        - cd android && ./gradlew assembleDebug
    artifacts:
        paths:
            - android/app/build/outputs/apk/debug/
        expire_in: 1 week
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build_android_release:
    stage: build
    extends: .android_base
    script:
        # Setup signing
        - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
        - |
            cat > android/gradle.properties << EOF
            MYAPP_UPLOAD_STORE_FILE=keystore.jks
            MYAPP_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS
            MYAPP_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
            MYAPP_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
            EOF

        # Build
        - cd android && ./gradlew assembleRelease

        # Cleanup
        - rm app/keystore.jks
    artifacts:
        paths:
            - android/app/build/outputs/apk/release/
        expire_in: 4 weeks
    rules:
        - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

build_ios_release:
    stage: build
    extends: .ios_base
    script:
        # Setup certificates
        - security create-keychain -p "" build.keychain
        - security default-keychain -s build.keychain
        - security unlock-keychain -p "" build.keychain
        - echo "$IOS_CERTIFICATE_BASE64" | base64 -d > certificate.p12
        - security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        - security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
        - rm certificate.p12

        # Provisioning profile
        - mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        - echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

        # Build
        - cd ios
        - |
            xcodebuild archive \
                -workspace *.xcworkspace \
                -scheme App \
                -archivePath ../build/App.xcarchive \
                -destination "generic/platform=iOS" \
                -allowProvisioningUpdates

        # Export
        - |
            cat > ../ExportOptions.plist << EOF
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>method</key>
                <string>app-store</string>
                <key>teamID</key>
                <string>${APPLE_TEAM_ID}</string>
            </dict>
            </plist>
            EOF

        - |
            xcodebuild -exportArchive \
                -archivePath ../build/App.xcarchive \
                -exportPath ../build/ipa \
                -exportOptionsPlist ../ExportOptions.plist

        # Cleanup
        - security delete-keychain build.keychain
    artifacts:
        paths:
            - build/ipa/
        expire_in: 4 weeks
    rules:
        - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# EAS Build (Alternative)
eas_build:
    stage: build
    image: node:${NODE_VERSION}
    before_script:
        - npm ci
        - npm install -g eas-cli
    script:
        - echo "$EXPO_TOKEN" | eas login
        - |
            if [ "$CI_COMMIT_BRANCH" == "main" ]; then
                eas build --platform all --profile production --non-interactive
            else
                eas build --platform all --profile preview --non-interactive
            fi
    rules:
        - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
          when: manual
    allow_failure: true

# ============================================================================
# DEPLOY STAGE
# ============================================================================
deploy_firebase:
    stage: deploy
    image: node:20
    before_script:
        - npm install -g firebase-tools
    script:
        - |
            firebase appdistribution:distribute \
                android/app/build/outputs/apk/release/app-release.apk \
                --app $FIREBASE_APP_ID \
                --groups "testers" \
                --token "$FIREBASE_TOKEN"
    dependencies:
        - build_android_release
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop"'
    environment:
        name: firebase-distribution

deploy_play_store:
    stage: deploy
    image: ruby:3.2
    before_script:
        - gem install fastlane
        - echo "$PLAY_STORE_SERVICE_ACCOUNT" > play-store-key.json
    script:
        - |
            fastlane supply \
                --apk android/app/build/outputs/apk/release/app-release.apk \
                --track internal \
                --json_key play-store-key.json \
                --package_name $ANDROID_PACKAGE_NAME
        - rm play-store-key.json
    dependencies:
        - build_android_release
    rules:
        - if: '$CI_COMMIT_BRANCH == "main"'
          when: manual
    environment:
        name: play-store

deploy_testflight:
    stage: deploy
    extends: .ios_base
    script:
        - |
            xcrun altool --upload-app \
                --type ios \
                --file build/ipa/*.ipa \
                --apiKey "$APPSTORE_KEY_ID" \
                --apiIssuer "$APPSTORE_ISSUER_ID"
    dependencies:
        - build_ios_release
    rules:
        - if: '$CI_COMMIT_BRANCH == "main"'
          when: manual
    environment:
        name: testflight

# EAS Submit (Alternative)
eas_submit:
    stage: deploy
    image: node:${NODE_VERSION}
    before_script:
        - npm ci
        - npm install -g eas-cli
    script:
        - echo "$EXPO_TOKEN" | eas login
        - eas submit --platform android --profile production --non-interactive
        - eas submit --platform ios --profile production --non-interactive
    rules:
        - if: '$CI_COMMIT_BRANCH == "main"'
          when: manual
    allow_failure: true
