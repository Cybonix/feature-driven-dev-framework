# Ops Configuration Template
# Copy this to ops/config.yml and customize for your project

project:
    name: "[PROJECT_NAME]"
    language: "generic"   # python | node | go | rust | java | kotlin | swift | dart | generic
    framework: "none"     # django | fastapi | react | vue | angular | svelte | next | nuxt | remix | express | compose | swiftui | none
    type: "library"       # service | library | cli | frontend | pwa | android | ios | react-native | flutter

    # Platform-specific configuration (required when type is android|ios|react-native|flutter)
    # Uncomment and configure for mobile projects:
    # platform:
    #     target_sdk: "34"              # Android: target API level
    #     min_sdk: "24"                 # Android: minimum API level
    #     deployment_target: "15.0"     # iOS: minimum iOS version
    #     flutter_version: "3.16"       # Flutter: SDK version
    #     bundle_id: "com.example.app"  # iOS/Android: app identifier
    #     signing:
    #         keystore_env: "ANDROID_KEYSTORE_BASE64"
    #         certificate_env: "IOS_CERTIFICATE_BASE64"
    #         provisioning_env: "IOS_PROVISIONING_PROFILE_BASE64"

# Environments determine deployment strategies
environments:
    - name: "development"
      branch: "feature/*"
      deploy_strategy: "ephemeral"
    - name: "staging"
      branch: "develop"
      deploy_strategy: "rolling"
    - name: "production"
      branch: "main"
      deploy_strategy: "rolling"

# Central Command Registry: Agents read this to know how to operate the repo
# Update these commands to match your project's toolchain
commands:
    # Core commands (all project types)
    setup: "echo 'No setup defined'"
    lint: "echo 'No lint defined'"
    test: "echo 'No test defined'"
    build: "echo 'No build defined'"
    start: "echo 'No start defined'"

    # Mobile-specific commands (used when type is android|ios|react-native|flutter)
    build_android: "echo 'No Android build defined'"
    build_ios: "echo 'No iOS build defined'"
    deploy_testflight: "echo 'No TestFlight deploy defined'"
    deploy_play_store: "echo 'No Play Store deploy defined'"
    deploy_firebase: "echo 'No Firebase App Distribution deploy defined'"

    # Frontend-specific commands (used when type is frontend|pwa)
    lighthouse: "echo 'No lighthouse audit defined'"
    bundle_analyze: "echo 'No bundle analysis defined'"
    visual_test: "echo 'No visual testing defined'"
    e2e: "echo 'No e2e testing defined'"

# Security Configuration: Defines the gates for CI
security:
    sast:
        tool: "trivy"
        args: "fs ."
        fail_on: "high,critical"
    sca:
        tool: "trivy"
        args: "fs ."
        fail_on: "high,critical"
    secrets:
        tool: "gitleaks"
        args: "detect --no-git"
        fail_on: "any"
    compliance:
        require_signed_commits: false
        require_code_review: true

    # Mobile-specific security (used when type is android|ios|react-native|flutter)
    mobile:
        tool: "mobsf"
        args: "--scan"
        fail_on: "high,critical"
        platforms: ["android", "ios"]

    # Frontend-specific security (used when type is frontend|pwa)
    frontend:
        npm_audit: true
        lighthouse_threshold: 80
        bundle_size_limit: "500kb"

# CI/CD Metadata
ci_cd:
    providers:
        - "github"
        - "gitlab"
    stages:
        - "validate"  # lint, format
        - "test"      # unit, integration
        - "security"  # sast, sca, secrets, mobile
        - "build"     # compile, docker build, app signing
        - "deploy"    # app distribution, store upload
        - "release"   # semantic release

